<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Psychic Plane</title>
  <script>
    // Decide the intro before first paint: it plays on every visit, except for reduced motion.
    (function () {
      var d = document.documentElement;
      var mode = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'none' : 'full';
      d.classList.add('js');
      d.dataset.intro = mode;
      if (mode !== 'none') {
        d.classList.add('intro-on');
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Special+Elite&family=UnifrakturMaguntia&display=swap">
